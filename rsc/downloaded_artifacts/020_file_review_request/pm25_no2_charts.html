<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PM2.5 and NO&#x2082; change 2010&ndash;2024</title>

  <!-- ============================================================
       REGION DATA
       Columns: region (PK), name, color
       ============================================================ -->
  <script type="application/json" id="region-data">
  [
    { "region": "EUR", "name": "Europe",            "color": "#D85A30" },
    { "region": "CEA", "name": "Central East Asia", "color": "#D4537E" },
    { "region": "NAM", "name": "North America",     "color": "#639922" }
  ]
  </script>

  <!-- ============================================================
       CITY DATA
       Columns: city (PK), region (FK -> region-data.region), pm25, no2
       pm25 / no2 are % change values 2010-2024
       ============================================================ -->
  <script type="application/json" id="city-data">
  [
    { "city": "Beijing",       "region": "CEA", "pm25": -48, "no2": -34 },
    { "city": "Warsaw",        "region": "EUR", "pm25": -44, "no2": -21 },
    { "city": "Rotterdam",     "region": "EUR", "pm25": -41, "no2": -46 },
    { "city": "Berlin",        "region": "EUR", "pm25": -40, "no2": -31 },
    { "city": "Brussels",      "region": "EUR", "pm25": -39, "no2": -30 },
    { "city": "Heidelberg",    "region": "EUR", "pm25": -38, "no2": -35 },
    { "city": "Amsterdam",     "region": "EUR", "pm25": -36, "no2": -47 },
    { "city": "Paris",         "region": "EUR", "pm25": -35, "no2": -34 },
    { "city": "Wuhan",         "region": "CEA", "pm25": -33, "no2": -37 },
    { "city": "Nanjing",       "region": "CEA", "pm25": -32, "no2": -39 },
    { "city": "Hangzhou",      "region": "CEA", "pm25": -30, "no2": -43 },
    { "city": "Rome",          "region": "EUR", "pm25": -28, "no2": -22 },
    { "city": "London",        "region": "EUR", "pm25": -27, "no2": -40 },
    { "city": "Chengdu",       "region": "CEA", "pm25": -26, "no2": -40 },
    { "city": "Qingdao",       "region": "CEA", "pm25": -26, "no2": -29 },
    { "city": "Zhenjiang",     "region": "CEA", "pm25": -25, "no2": -37 },
    { "city": "Hong Kong",     "region": "CEA", "pm25": -23, "no2": -33 },
    { "city": "San Francisco", "region": "NAM", "pm25": -22, "no2": -23 },
    { "city": "Shenzhen",      "region": "CEA", "pm25": -21, "no2": -22 }
  ]
  </script>

  <style>
    body { font-family: sans-serif; background: #fff; margin: 2rem; color: #333; }
    h2 { font-size: 15px; font-weight: 500; margin: 0 0 0.75rem; text-align: center; color: #185FA5; }
    .bar-row { display: flex; gap: 2rem; margin-bottom: 1.5rem; }
    .bar-wrap { flex: 1; min-width: 0; }
    .legend { display: flex; gap: 20px; margin-bottom: 1rem; font-size: 13px; color: #666; }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .sq  { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  </style>
</head>
<body>

  <!-- BAR CHARTS -->
  <div class="bar-row">
    <div class="bar-wrap">
      <h2>PM2.5 change 2010&ndash;2024</h2>
      <div style="position:relative;height:660px;"><canvas id="barPM"></canvas></div>
    </div>
    <div class="bar-wrap">
      <h2>NO&#x2082; change 2010&ndash;2024</h2>
      <div style="position:relative;height:660px;"><canvas id="barNO"></canvas></div>
    </div>
  </div>
  <div id="bar-legend" class="legend" style="justify-content:center;margin-bottom:2rem;"></div>

  <!-- SCATTER CHART -->
  <div style="max-width:800px;">
    <h2>PM2.5 vs NO&#x2082; change 2010&ndash;2024</h2>
    <div id="scatter-legend" class="legend"></div>
    <div style="position:relative;width:100%;height:560px;">
      <canvas id="scatter"></canvas>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script>
  // --- Chart chrome colours ---
  const AXIS_COLOR = '#888888';                // tick labels and axis titles
  const GRID_COLOR = 'rgba(130,130,130,0.15)'; // grid lines: same grey family, very faint

  // --- Scatter label offsets (pixels) — purely graphical, to avoid overlap ---
  // Default: labels are placed 7px right of and 3px above the point centre.
  // Exceptions override x (negative = left of point) or y (positive = below centre).
  const LABEL_OFFSET_X = { 'San Francisco': -70, 'Shenzhen': -55, 'Warsaw': -42 };
  const LABEL_OFFSET_Y = { 'Brussels': -8, 'Heidelberg': 12, 'Paris': 12, 'Warsaw': -2 };

  const labelOffset = (city) => ({
    x: LABEL_OFFSET_X[city] ?? 7,
    y: LABEL_OFFSET_Y[city] ?? -3,
  });

  // --- Parse data tables ---
  const regions = JSON.parse(document.getElementById('region-data').textContent);
  const cities  = JSON.parse(document.getElementById('city-data').textContent);

  // --- Join index: region -> region object ---
  const regionMap = regions.reduce((acc, r) => { acc[r.region] = r; return acc; }, {});

  // --- Build legends from region-data ---
  function buildLegend(id, dotClass) {
    const el = document.getElementById(id);
    regions.forEach(r => {
      el.innerHTML += `<span><span class="${dotClass}" style="background:${r.color};"></span>${r.name}</span>`;
    });
  }
  buildLegend('bar-legend',     'sq');
  buildLegend('scatter-legend', 'dot');

  // --- Bar charts ---
  function makeBarChart(canvasId, valueKey) {
    const sorted = [...cities].sort((a, b) => a[valueKey] - b[valueKey]);
    new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: {
        labels: sorted.map(c => c.city),
        datasets: [{
          data: sorted.map(c => c[valueKey]),
          backgroundColor: sorted.map(c => regionMap[c.region].color + 'dd'),
          borderColor:     sorted.map(c => regionMap[c.region].color),
          borderWidth: 1,
          borderRadius: 2,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ctx.parsed.x + '%' } }
        },
        scales: {
          x: {
            min: -55, max: 5,
            ticks: { color: AXIS_COLOR, callback: v => v + '%' },
            grid:  { color: GRID_COLOR }
          },
          y: {
            ticks: { color: '#444', font: { size: 11 } },
            grid:  { display: false }
          }
        }
      }
    });
  }

  makeBarChart('barPM', 'pm25');
  makeBarChart('barNO', 'no2');

  // --- Scatter chart ---
  const scatterDatasets = regions.map(r => ({
    label: r.name,
    data: cities.filter(c => c.region === r.region).map(c => ({ x: c.pm25, y: c.no2, city: c.city })),
    backgroundColor: r.color + 'cc',
    borderColor: r.color,
    borderWidth: 1.5,
    pointRadius: 6,
    pointHoverRadius: 8,
  }));

  new Chart(document.getElementById('scatter'), {
    type: 'scatter',
    data: { datasets: scatterDatasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 20, right: 30, bottom: 10, left: 10 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.raw.city + ': PM2.5 ' + ctx.raw.x + '%, NO\u2082 ' + ctx.raw.y + '%'
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'PM2.5 change 2010\u20132024 (%)', color: AXIS_COLOR, font: { size: 12 } },
          min: -55, max: 5,
          ticks: { color: AXIS_COLOR, callback: v => v + '%' },
          grid:  { color: GRID_COLOR }
        },
        y: {
          title: { display: true, text: 'NO\u2082 change 2010\u20132024 (%)', color: AXIS_COLOR, font: { size: 12 } },
          min: -55, max: 5,
          ticks: { color: AXIS_COLOR, callback: v => v + '%' },
          grid:  { color: GRID_COLOR }
        }
      }
    },
    plugins: [{
      id: 'cityLabels',
      afterDatasetsDraw(chart) {
        const ctx = chart.ctx;
        ctx.save();
        ctx.font = '11px sans-serif';
        scatterDatasets.forEach((ds, di) => {
          const meta = chart.getDatasetMeta(di);
          ds.data.forEach((pt, i) => {
            const el = meta.data[i];
            if (!el) return;
            const { x, y } = el.getProps(['x', 'y'], true);
            const off = labelOffset(pt.city);
            ctx.fillStyle = regions[di].color;
            ctx.fillText(pt.city, x + off.x, y + off.y);
          });
        });
        ctx.restore();
      }
    }]
  });
  </script>

</body>
</html>
