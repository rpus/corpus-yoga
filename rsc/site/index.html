<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversation corpus</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #222;
      padding: 2rem;
    }

    h2 {
      font-size: 13px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 1rem;
    }

    .section {
      margin-bottom: 2.5rem;
    }

    #tl-wrap {
      font-size: 13px;
    }

    #tl-header {
      display: flex;
      align-items: flex-end;
      margin-bottom: 4px;
    }

    #tl-label-spacer {
      width: 220px;
      flex-shrink: 0;
    }

    #tl-axis {
      flex: 1;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #aaa;
      padding: 0 2px;
    }

    #tl-grid {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tl-lane {
      display: flex;
      align-items: center;
      height: 16px;
    }

    .tl-label {
      width: 220px;
      flex-shrink: 0;
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 8px;
      text-align: right;
    }

    .tl-track {
      position: relative;
      flex: 1;
      height: 100%;
    }

    .tl-bar {
      position: absolute;
      height: 100%;
      border-radius: 2px;
      cursor: pointer;
      min-width: 3px;
      transition: opacity 0.12s;
    }

    .tl-bar:hover {
      opacity: 0.6;
    }

    .tl-dormant {
      position: absolute;
      height: 100%;
      border-radius: 2px;
      background: #B4B2A9;
      opacity: 0.2;
      pointer-events: none;
    }

    #tl-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-bottom: 0.75rem;
      padding-left: 220px;
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #999;
    }

    .leg-swatch {
      width: 20px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    #clouds-header {
      display: flex;
      align-items: baseline;
      gap: 2rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    /* Collapsible section heading: an h2 that is its own show/hide control,
       with a triangle that rotates open. Reusable via class. */
    summary.section-toggle {
      cursor: pointer;
      list-style: none;
      width: fit-content;
    }

    summary.section-toggle::-webkit-details-marker {
      display: none;
    }

    summary.section-toggle::before {
      content: '▸';
      display: inline-block;
      margin-right: 0.5rem;
      color: #888;
      transition: transform 0.15s;
    }

    details[open] > summary.section-toggle::before {
      transform: rotate(90deg);
    }

    .toggle-group {
      display: flex;
      border: 0.5px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
    }

    .toggle-btn {
      background: none;
      border: none;
      border-right: 0.5px solid #ccc;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
      color: #888;
      transition: background 0.12s, color 0.12s;
    }

    .toggle-btn:last-child {
      border-right: none;
    }

    .toggle-btn.active {
      background: #222;
      color: #fff;
    }

    .toggle-btn:hover:not(.active) {
      background: #f5f5f5;
    }

    .toggle-btn:disabled {
      opacity: 0.35;
      cursor: default;
      background: none;
    }

    #clouds {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .cloud-panel {
      border: 0.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 1.25rem;
      min-height: 280px;
    }

    .cloud-title {
      font-size: 11px;
      font-weight: 500;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 0.3rem;
    }

    .cloud-sub {
      font-size: 11px;
      color: #ccc;
      font-style: italic;
      margin-bottom: 1rem;
    }

    .cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 9px;
      align-items: baseline;
      line-height: 1.6;
    }

    .word {
      cursor: default;
      border-radius: 3px;
      padding: 1px 2px;
      transition: opacity 0.12s;
    }

    .word:hover {
      opacity: 0.55;
    }


    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1a1a;
        color: #ddd;
      }

      h2 {
        color: #555;
      }

      .tl-label {
        color: #666;
      }

      #tl-axis {
        color: #555;
      }

      .toggle-group {
        border-color: #444;
      }

      .toggle-btn {
        color: #666;
        border-right-color: #444;
      }

      .toggle-btn.active {
        background: #ddd;
        color: #111;
      }

      .toggle-btn:hover:not(.active) {
        background: #252525;
      }

      .toggle-btn:disabled {
        background: none;
      }

      .cloud-panel {
        border-color: #2c2c2c;
      }

      .cloud-title {
        color: #555;
      }

      .cloud-sub {
        color: #444;
      }

    }
  </style>
</head>

<body>

  <!-- ── data ───────────────────────────────────────── -->

  <!-- One row per conversation. Generated by present.sh via timeline.py from
       conversations.json (batch page), or by present_corpus.py from output/markdown
       (corpus page — where the ordinal is the corpus_index number over every source).
       chat:          1-based ordinal — the canonical conversation number for the page's
                      scope, shared with the atomised/projected filenames
       name:          conversation title
       dormant_from:  ISO timestamp of last message (second precision); empty when the
                      source carries no time data (gemini scrapes)
       uuid:          the conversation's durable identity — claude uuid / gemini app id;
                      the join key to the uuid8-keyed stores; the ordinal is presentation
                      only and renumbers between scopes
       provider:      claude / gemini. Emitted by both presenters:
                      present_corpus from the corpus directory, timeline as the
                      constant claude (a batch is a claude.ai bulk export)
       channel:       chat / code (code sessions are claude-provided, code-channelled).
                      Emitted by both presenters: present_corpus from the corpus
                      directory, timeline as the constant chat
       turns:         message count of the conversation — real for every source
                      (present_corpus counts turn_seq, which parses all sources;
                      timeline counts chat_messages), so gemini rows report it
                      even though they carry no timeline spans -->
  <!-- data-chats.json:begin -->
  <script id="data-chats" type="application/json">
  {"columns":["chat","name","dormant_from","uuid","provider","channel","turns"],"rows":[]}
  </script>
  <!-- data-chats.json:end -->

  <!-- One row per contiguous same-day block of messages within a conversation.
       Generated by present.sh via timeline.py from conversations.json.
       chat:     conversation ordinal (joins to data-chats.chat)
       from, to: ISO timestamps (second precision)
       messages: message count in the span -->
  <!-- data-spans.json:begin -->
  <script id="data-spans" type="application/json">
  {"columns":["chat","from","to","messages"],"rows":[]}
  </script>
  <!-- data-spans.json:end -->

  <!-- The category palette. AUTHORED here, not inferred: a category → hue map is
       a design decision (a stylesheet), so it lives inline in the template, not in
       the paid per-batch pipeline. Edit a hue and `git diff` shows it. The chat →
       category ASSIGNMENT (data-chat-categories below) is the genuinely inferred part;
       it assigns against these canonical names.
       category: short snake_case label   hue: HSV hue angle (0–360) for timeline colour -->
  <script id="data-categories" type="application/json">
  {"columns":["category","hue"],"rows":[["mathematics",220],["physics",180],["philosophy",270],["meta",40],["tooling",25],["creative",330],["practical",90],["social",0]],"note":"Authored canonical palette (design, not inference) — edit hues here."}
  </script>

  <!-- Claude-generated join table: which conversations belong to which category.
       Generated by present.sh / dashboard.sh (stored id-keyed under output/;
       present.sh re-derives the ordinal at injection time via rekey_chats.py).
       chat:     conversation ordinal (joins to data-chats.chat)
       category: value from data-categories
       note:     provenance (injected by present.sh) -->
  <!-- data-chat-categories.json:begin -->
  <script id="data-chat-categories" type="application/json">
  {"columns":["chat","category"],"rows":[],"note":""}
  </script>
  <!-- data-chat-categories.json:end -->

  <!-- Literal word frequencies, split by sender. Generated by word_freq_literal.py.
       Three sub-tables (human / assistant / both), each with:
       word:  token
       count: occurrence count -->
  <!-- data-literal-words.json:begin -->
  <script id="data-literal-words" type="application/json">
  {"human":{"columns":["word","count"],"rows":[]},"assistant":{"columns":["word","count"],"rows":[]},"both":{"columns":["word","count"],"rows":[]}}
  </script>
  <!-- data-literal-words.json:end -->

  <!-- Claude-generated semantic word weights from conversation summaries.
       Generated by present.sh / dashboard.sh.
       word:   concept or term
       count:  inferred salience weight (not raw frequency)
       provider: which provider the concept is salient in — claude / gemini / both
               (schema v2; a pre-v2 capture lacks the column and the provider
               toggle disables until the next `yoga dashboard capture`)
       note:   provenance (injected by present.sh) -->
  <!-- data-semantic-concepts.json:begin -->
  <script id="data-semantic-concepts" type="application/json">
  {"columns":["word","count","provider"],"rows":[],"note":""}
  </script>
  <!-- data-semantic-concepts.json:end -->

  <!-- Files associated with each conversation, sourced from output/artifacts/downloaded/.
       Generated by present.sh / files_from_downloaded.py. Used to populate
       the hover tooltip on timeline bars and to drive the files/no-files filter.
       chat: conversation ordinal (joins to data-chats.chat)
       file: path relative to the per-conversation downloaded directory -->
  <!-- data-files.json:begin -->
  <script id="data-files" type="application/json">
  {"columns":["chat","file"],"rows":[]}
  </script>
  <!-- data-files.json:end -->

  <!-- ── markup ─────────────────────────────────────── -->

  <!-- Corpus filters, two axes of the same classification: PROVIDER (claude /
       gemini — the provider toggle) and CHANNEL (chat / code — code sessions are
       claude-provided). Both filter the timeline lanes; the provider toggle also
       filters the semantic cloud (v2 captures tag each concept claude/gemini/both;
       untagged pre-v2 data cannot answer, so the cloud shows all and the note says
       why). Concepts carry no channel tag, so the channel toggle leaves the cloud
       untouched. Batch-derived panels (literal cloud) are claude-chat by
       construction and unaffected. -->
  <div class="section" id="provider-header" style="display:flex;align-items:baseline;gap:2rem;flex-wrap:wrap;">
    <h2 style="margin-bottom:0;">Provider</h2>
    <div class="toggle-group" id="provider-toggle">
      <button class="toggle-btn" data-provider="claude">claude</button>
      <button class="toggle-btn" data-provider="gemini">gemini</button>
      <button class="toggle-btn active" data-provider="both">both</button>
    </div>
    <h2 style="margin-bottom:0;">Channel</h2>
    <div class="toggle-group" id="channel-toggle">
      <button class="toggle-btn" data-channel="chat">chat</button>
      <button class="toggle-btn" data-channel="code">code</button>
      <button class="toggle-btn active" data-channel="both">both</button>
    </div>
    <span id="provider-note" style="font-size:11px;color:#aaa;"></span>
  </div>

  <!-- Clouds above timeline (2026-07-12): the word clouds are the corpus's
       CONTENT, the timeline its shape over time — content reads first. -->
  <div class="section">
    <details open>
      <summary class="section-toggle"><h2 style="display:inline;margin:0;">Word clouds</h2></summary>
    <div id="clouds" style="margin-top:1rem;">
      <div class="cloud-panel">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;">
          <div class="cloud-title">Literal</div>
          <!-- Governs THIS panel only: human/assistant is a role split, which needs
               role-tagged text. The literal cloud tokenizes each turn by speaker; a
               concept (semantic panel) is spoken by no one, so it has no such mode. -->
          <div class="toggle-group" id="literal-mode">
            <button class="toggle-btn active" data-mode="human">human</button>
            <button class="toggle-btn" data-mode="assistant">assistant</button>
            <button class="toggle-btn" data-mode="both">both</button>
          </div>
        </div>
        <div class="cloud-sub" id="literal-sub">Surface word frequency from all messages</div>
        <div class="cloud" id="literal-cloud"></div>
      </div>
      <div class="cloud-panel">
        <div class="cloud-title">Semantic</div>
        <div class="cloud-sub">Concepts inferred by Claude from conversation summaries</div>
        <div class="cloud" id="semantic-cloud"></div>
      </div>
    </div>
    </details>
  </div>

  <div class="section">
    <details open>
      <summary class="section-toggle"><h2 style="display:inline;margin:0;">Engagement timeline</h2></summary>
      <!-- Control in the body, not the summary: a click filters, and can never be
           mistaken for (or hijack) the collapse. Governs this section's lanes only. -->
      <div id="tl-section-header" style="display:flex;margin:1rem 0;">
        <div class="toggle-group">
          <button class="toggle-btn" data-filter="filesOnly">files</button>
          <button class="toggle-btn" data-filter="noFiles">no files</button>
          <button class="toggle-btn active" data-filter="both">both</button>
        </div>
      </div>
      <div id="tl-legend"></div>
      <div id="tl-wrap">
        <div id="tl-header">
          <div id="tl-label-spacer"></div>
          <div id="tl-axis"></div>
        </div>
        <div id="tl-grid"></div>
      </div>
    </details>
  </div>


  <!-- ── external-load toggle ──────────────────────── -->
  <div class="section" id="external-load-section" style="display:flex;align-items:center;gap:1rem;">
    <button id="try-external-btn" style="font-size:12px;padding:4px 10px;border:1px solid #ccc;border-radius:4px;background:#fafafa;cursor:pointer;color:#555;">
      Try loading external data files
    </button>
    <span id="external-load-status" style="font-size:11px;color:#aaa;"></span>
  </div>

  <!-- ── logic ──────────────────────────────────────── -->
  <script>

    // ── constants ────────────────────────────────────────

    const DATA_SOURCES = [
      { key: 'chats',          id: 'data-chats',             file: 'data-chats.json' },
      { key: 'spans',          id: 'data-spans',             file: 'data-spans.json' },
      { key: 'categories',     id: 'data-categories' },  // authored palette: inline-only, no external file
      { key: 'chatCategories', id: 'data-chat-categories',   file: 'data-chat-categories.json' },
      { key: 'literal',        id: 'data-literal-words',     file: 'data-literal-words.json' },
      { key: 'semantic',       id: 'data-semantic-concepts', file: 'data-semantic-concepts.json' },
      { key: 'files',          id: 'data-files',             file: 'data-files.json' },
    ];

    const FilesFilter = { Both: 'both', FilesOnly: 'filesOnly', NoFiles: 'noFiles' };

    const CLOUD_SUBTITLES = {
      both:      'Surface word frequency from all messages',
      human:     'Surface word frequency from human messages only',
      assistant: 'Surface word frequency from assistant messages only',
    };

    // ── pure utilities ───────────────────────────────────

    function parse(id) {
      return JSON.parse(document.getElementById(id).textContent);
    }

    function unpack(t) {
      return t.rows.map(r => Object.fromEntries(t.columns.map((k, i) => [k, r[i]])));
    }

    function hsvToHex(h, s, v) {
      v = Math.min(1, Math.max(0, v));
      h /= 360;
      const i = Math.floor(h * 6), f = h * 6 - i,
            p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
      let r, g, b;
      switch (i % 6) {
        case 0: r = v; g = t; b = p; break; case 1: r = q; g = v; b = p; break;
        case 2: r = p; g = v; b = t; break; case 3: r = p; g = q; b = v; break;
        case 4: r = t; g = p; b = v; break; case 5: r = v; g = p; b = q; break;
      }
      return '#' + [r, g, b].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
    }

    function fmt(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' +
             d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    // ── data loading ─────────────────────────────────────

    const DataSource = { InlinedScripts: 'inlinedScripts', ExternalFiles: 'externalFiles' };

    function loadFromInlinedScripts() {
      const sources = {};
      DATA_SOURCES.forEach(({ key, id }) => { sources[key] = parse(id); });
      return sources;
    }

    // Returns { packedTables, loaded: string[], failed: string[] }.
    async function loadFromExternalFiles() {
      const sources = loadFromInlinedScripts(); // baseline from inline
      const loaded = [], failed = [];
      await Promise.all(DATA_SOURCES.map(async ({ key, file }) => {
        if (!file) return; // inline-only source (the authored palette) — nothing to fetch
        try {
          const resp = await fetch(file);
          if (!resp.ok) throw new Error(resp.status);
          sources[key] = await resp.json();
          loaded.push(file);
        } catch {
          failed.push(file);
        }
      }));
      return { packedTables: sources, loaded, failed };
    }

    async function load(dataSource) {
      if (dataSource === DataSource.ExternalFiles) return loadFromExternalFiles();
      return { packedTables: loadFromInlinedScripts(), loaded: [], failed: [] };
    }

    function unpackAll(packedTables) {
      const chats          = unpack(packedTables.chats);
      const spans          = unpack(packedTables.spans);
      const categories     = unpack(packedTables.categories);
      const chatCategories = unpack(packedTables.chatCategories);
      const literalRaw     = packedTables.literal;
      const literalData    = {
        human:     unpack(literalRaw.human),
        assistant: unpack(literalRaw.assistant),
        both:      unpack(literalRaw.both),
      };
      const semanticWords = unpack(packedTables.semantic);
      const filesRaw      = unpack(packedTables.files);
      const filesMap      = {};
      filesRaw.forEach(r => {
        if (!filesMap[r.chat]) filesMap[r.chat] = [];
        filesMap[r.chat].push(r.file);
      });
      chats.forEach(c => { c.spans = spans.filter(s => s.chat === c.chat); });
      return { chats, spans, categories, chatCategories, literalData, semanticWords, filesMap };
    }

    // ── render functions ─────────────────────────────────

    function renderLegend(categories, chatCategories) {
      const legEl = document.getElementById('tl-legend');
      legEl.innerHTML = '';
      const usedCats = [...new Set(chatCategories.map(c => c.category))];
      categories.filter(c => usedCats.includes(c.category)).forEach(cat => {
        const sw   = hsvToHex(cat.hue, 0.72, 0.55 + 0.27 * 0.5);
        const item = document.createElement('div'); item.className = 'leg';
        item.innerHTML = `<span class="leg-swatch" style="background:${sw}"></span>${cat.category}`;
        legEl.appendChild(item);
      });
      const dormItem = document.createElement('div'); dormItem.className = 'leg';
      dormItem.innerHTML = '<span class="leg-swatch" style="background:#B4B2A9;opacity:0.5;"></span>dormant';
      legEl.appendChild(dormItem);
    }

    // Provider and channel come from the explicit columns every generator now
    // emits: present_corpus (from the corpus directory) and timeline (constant
    // claude × chat, a batch being a claude.ai bulk export). No id-shape guessing —
    // a code session's 36-char uuid once masqueraded as claude. The defaults are a
    // defensive fallback for hand-authored data only, never the two generators.
    function providerOf(chat) { return chat.provider || 'claude'; }
    function channelOf(chat) { return chat.channel || 'chat'; }

    function renderTimeline(chats, spans, colorMap, filesMap, filesFilter, providerFilter, channelFilter) {
      const bySource     = (providerFilter && providerFilter !== 'both')
                           ? chats.filter(c => providerOf(c) === providerFilter) : chats;
      const byChannel    = (channelFilter && channelFilter !== 'both')
                           ? bySource.filter(c => channelOf(c) === channelFilter) : bySource;
      const visibleChats = filesFilter === FilesFilter.FilesOnly ? byChannel.filter(c => filesMap[c.chat]) :
                           filesFilter === FilesFilter.NoFiles   ? byChannel.filter(c => !filesMap[c.chat]) :
                           byChannel;
      // The axis spans only what carries time data. A source with none (gemini
      // scrapes hold no timestamps) still LISTS — its lanes render bar-less with
      // the absence named, never with invented bars.
      const timed  = visibleChats.filter(c => c.spans.length || c.dormant_from);
      const times  = timed.flatMap(c => c.spans.map(s => new Date(s.from).getTime()))
                          .concat(timed.filter(c => c.dormant_from)
                                       .map(c => new Date(c.dormant_from).getTime()));
      const tMin   = times.length ? Math.min(...times) : 0;
      const tMax   = times.length ? Math.max(...times) : 1;
      const tRange = Math.max(tMax - tMin, 1);
      const axisEl = document.getElementById('tl-axis');
      axisEl.innerHTML = '';
      if (times.length) {
        for (let i = 0; i <= 7; i++) {
          const sp = document.createElement('span');
          sp.textContent = new Date(tMin + tRange * i / 7)
            .toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
          axisEl.appendChild(sp);
        }
      }

      const grid = document.getElementById('tl-grid');
      grid.innerHTML = '';
      visibleChats.forEach(chat => {
        const lane  = document.createElement('div'); lane.className = 'tl-lane';
        const label = document.createElement('div'); label.className = 'tl-label';
        label.textContent = '#' + chat.chat + ' ' + chat.name;
        const chatFiles   = filesMap[chat.chat];
        label.title       = `${chat.turns ?? '?'} turns\n` + chat.name + '\n' +
                             (chatFiles ? chatFiles.join('\n') : '(no files)');

        const track = document.createElement('div'); track.className = 'tl-track';
        if (!chat.spans.length && !chat.dormant_from) {
          const bare = document.createElement('span');
          bare.textContent   = 'no activity data in source';
          bare.style.cssText = 'font-size:9px;color:#bbb;padding-left:6px;';
          track.appendChild(bare);
          lane.appendChild(label); lane.appendChild(track); grid.appendChild(lane);
          return;
        }
        const dormT = new Date(chat.dormant_from).getTime();
        const dLeft = (dormT - tMin) / tRange * 100;
        if (chat.dormant_from && 100 - dLeft > 0.1) {
          const dorm = document.createElement('div'); dorm.className = 'tl-dormant';
          dorm.style.left  = dLeft + '%';
          dorm.style.width = (100 - dLeft) + '%';
          track.appendChild(dorm);
        }
        chat.spans.forEach(s => {
          const bar   = document.createElement('div'); bar.className = 'tl-bar';
          const left  = (new Date(s.from).getTime() - tMin) / tRange * 100;
          const width = Math.max(
            (new Date(s.to).getTime() - new Date(s.from).getTime()) / tRange * 100, 0.25);
          bar.style.left       = left + '%';
          bar.style.width      = width + '%';
          bar.style.background = colorMap[chat.chat];
          bar.style.opacity    = '0.88';
          bar.title = `#${chat.chat} — ${chat.name}\nFrom: ${fmt(s.from)}\nTo: ${fmt(s.to)}\nMessages: ${s.messages}`;
          track.appendChild(bar);
        });
        lane.appendChild(label); lane.appendChild(track); grid.appendChild(lane);
      });
    }

    function renderCloud(words, containerId, hue) {
      const el  = document.getElementById(containerId);
      el.innerHTML = '';
      const max = Math.max(...words.map(w => w.count));
      const min = Math.min(...words.map(w => w.count));
      // Deterministic scatter: order by a stable per-word hash (not count, so the
      // cloud reads as a cloud, not a ranked list) — the SAME arrangement every
      // render, so a re-click, a mode round-trip, or a reload never reshuffles.
      const scatter = w => { let h = 0; for (let i = 0; i < w.length; i++) h = (h * 31 + w.charCodeAt(i)) | 0; return h; };
      [...words].sort((a, b) => scatter(a.word) - scatter(b.word) || (a.word < b.word ? -1 : 1)).forEach(({ word, count, provider }) => {
        const norm = (count - min) / Math.max(max - min, 1);
        const span = document.createElement('span'); span.className = 'word';
        span.textContent   = word;
        span.style.fontSize   = (11 + Math.round(norm * 26)) + 'px';
        span.style.color      = `hsl(${hue},${55 + Math.round(norm * 25)}%,${62 - Math.round(norm * 32)}%)`;
        span.style.fontWeight = norm > 0.6 ? '500' : '400';
        span.title = `count: ${count}` + (provider ? ` · provider: ${provider}` : '');
        el.appendChild(span);
      });
    }

    function updateLiteralCloud(mode, literalData) {
      document.getElementById('literal-sub').textContent = CLOUD_SUBTITLES[mode];
      renderCloud(literalData[mode], 'literal-cloud', 210);
    }

    // ── init ─────────────────────────────────────────────

    function init(packedTables) {
      const { chats, spans, categories, chatCategories, literalData, semanticWords, filesMap } = unpackAll(packedTables);

      const catMap     = Object.fromEntries(categories.map(c => [c.category, c.hue]));
      const chatCatMap = Object.fromEntries(chatCategories.map(c => [c.chat, c.category]));
      const catCounts  = {}, catIdx = {}, colorMap = {};
      chats.forEach(c => { const cat = chatCatMap[c.chat] || 'meta'; catCounts[cat] = (catCounts[cat] || 0) + 1; });
      chats.forEach(chat => {
        const cat  = chatCatMap[chat.chat] || 'meta', hue = catMap[cat] ?? 0;
        const idx  = catIdx[cat] || 0, total = catCounts[cat] || 1;
        colorMap[chat.chat] = hsvToHex(hue, 0.72, 0.55 + 0.27 * idx / Math.max(total - 1, 1));
        catIdx[cat] = idx + 1;
      });

      renderLegend(categories, chatCategories);

      // Timeline state: the files filter and the page-top source filter compose;
      // either control re-renders with both current values.
      let curFilter  = document.querySelector('#tl-section-header .toggle-btn.active')?.dataset.filter || FilesFilter.Both;
      let curProvider  = document.querySelector('#provider-toggle .toggle-btn.active')?.dataset.provider || 'both';
      let curChannel = document.querySelector('#channel-toggle .toggle-btn.active')?.dataset.channel || 'both';
      const redrawTimeline = () => renderTimeline(chats, spans, colorMap, filesMap, curFilter, curProvider, curChannel);

      // Wire timeline filter buttons (re-wired each init so they close over fresh data).
      document.querySelectorAll('#tl-section-header .toggle-btn').forEach(btn => {
        btn.replaceWith(btn.cloneNode(true));
      });
      document.querySelectorAll('#tl-section-header .toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#tl-section-header .toggle-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          curFilter = btn.dataset.filter;
          redrawTimeline();
        });
      });
      redrawTimeline();

      // Provider toggle → timeline lanes (provider from the data-chats column, or the
      // id shape on pre-column pages) AND the semantic cloud. v2 concept captures
      // tag every concept with a provider; a provider view shows its own concepts plus
      // the shared ones. Untagged (pre-v2) concepts cannot filter — the cloud shows
      // all and the note says why — but the timeline filters regardless.
      const tagged = semanticWords.some(w => w.provider);
      const updateSemanticCloud = (src) => {
        const words = (src === 'both' || !tagged)
          ? semanticWords
          : semanticWords.filter(w => w.provider === src || w.provider === 'both');
        renderCloud(words, 'semantic-cloud', 270);
      };
      document.getElementById('provider-note').textContent =
        tagged ? '' : 'concepts untagged (pre-v2 capture) — the semantic cloud shows all providers until the next `yoga dashboard capture`';
      document.querySelectorAll('#provider-toggle .toggle-btn').forEach(btn => {
        btn.replaceWith(btn.cloneNode(true)); // drop stale listeners
      });
      document.querySelectorAll('#provider-toggle .toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#provider-toggle .toggle-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          curProvider = btn.dataset.provider;
          updateSemanticCloud(curProvider);
          redrawTimeline();
        });
      });
      updateSemanticCloud(curProvider);

      // Channel toggle → timeline lanes only (concepts carry no channel tag,
      // so the semantic cloud is provider-filtered but never channel-filtered).
      document.querySelectorAll('#channel-toggle .toggle-btn').forEach(btn => {
        btn.replaceWith(btn.cloneNode(true)); // drop stale listeners
      });
      document.querySelectorAll('#channel-toggle .toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#channel-toggle .toggle-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          curChannel = btn.dataset.channel;
          redrawTimeline();
        });
      });

      // Wire cloud toggle buttons (re-wired each init so they close over fresh literalData).
      document.querySelectorAll('#literal-mode .toggle-btn').forEach(btn => {
        btn.replaceWith(btn.cloneNode(true)); // drop stale listeners
      });
      const activeMode = document.querySelector('#literal-mode .toggle-btn.active')?.dataset.mode || 'human';
      document.querySelectorAll('#literal-mode .toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#literal-mode .toggle-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          updateLiteralCloud(btn.dataset.mode, literalData);
        });
      });
      updateLiteralCloud(activeMode, literalData);
    }

    // ── external load handler ────────────────────────────

    async function onExternalLoad() {
      const btn    = document.getElementById('try-external-btn');
      const status = document.getElementById('external-load-status');
      btn.disabled    = true;
      btn.textContent = 'Trying…';
      status.textContent = '';
      const { packedTables, loaded, failed } = await load(DataSource.ExternalFiles);
      if (loaded.length === 0) {
        status.style.color = '#c55';
        status.textContent = 'No external files found — using embedded data.';
      } else if (failed.length === 0) {
        status.style.color = '#585';
        status.textContent = `All ${loaded.length} files loaded.`;
      } else {
        status.style.color = '#a70';
        status.textContent = `${loaded.length} loaded, ${failed.length} not found ` +
          `(${failed.join(', ')}) — falling back to embedded for those.`;
      }
      btn.textContent = 'Try loading external data files';
      btn.disabled    = false;
      init(packedTables);
    }

    // ── main ─────────────────────────────────────────────

    function main() {
      document.getElementById('try-external-btn').addEventListener('click', onExternalLoad);
      load(DataSource.InlinedScripts).then(({ packedTables }) => init(packedTables));
    }

    main();
  </script>
</body>
