<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>

  <!--
    Circumcircle: centre (150,150), R=100
    Vertices: red(236.6025,100)  green(150,250)  blue(63.3975,100)
    Trim angle: arcsin(28/100) = 16.26 deg

    Outer clockwise arcs, centre (150,150):
      red->green:  (247.1384,126.2487) -> (178.0000,246.0000)
      green->blue: (122.0000,246.0000) -> (52.8616,126.2487)
      blue->red:   (80.8616,77.7513)   -> (219.1384,77.7513)

    Inner arc blue->green, centre (63.3975,200), sweep=1:
      (91.3975,104.0000) -> (160.5359,223.7513)
  -->

  <!-- Outer clockwise arcs -->
  <path d="M 247.1384 126.2487 A 100 100 0 0 1 178.0000 246.0000"
        fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 122.0000 246.0000 A 100 100 0 0 1 52.8616 126.2487"
        fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 80.8616 77.7513 A 100 100 0 0 1 219.1384 77.7513"
        fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Inner arc: blue->green, centre (63.3975,200), sweep=1 -->
  <path d="M 91.3975 104.0000 A 100 100 0 0 1 160.5359 223.7513"
        fill="none" stroke="black" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Circles -->
  <circle cx="236.6025" cy="100" r="28" fill="red"/>
  <circle cx="150"      cy="250" r="28" fill="green"/>
  <circle cx="63.3975"  cy="100" r="28" fill="blue"/>
</svg>
