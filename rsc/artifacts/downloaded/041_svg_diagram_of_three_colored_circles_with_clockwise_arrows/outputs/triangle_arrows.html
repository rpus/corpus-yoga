<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Triangle Arrows</title>
</head>
<body>
<svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
// ── Parameters ───────────────────────────────────────────────────────────────

const cx = 150, cy = 150;   // circumcircle centre
const R  = 100;              // circumcircle radius (vertex circles)
const r  = 28;               // coloured-circle radius
const stroke_width = 2.5;

const color = { red: "red", green: "green", blue: "blue", arrow: "black" };

// SVG viewport derived from parameters
const margin = r + 10;
const size   = 2 * (R + margin);

// ── Geometry ─────────────────────────────────────────────────────────────────

const PI    = Math.PI;
const sin   = Math.sin, cos = Math.cos, asin = Math.asin, atan2 = Math.atan2;

// Vertex angles (radians), SVG y-down, clockwise: red, green, blue
const a_red   = -PI/6;      // top-right
const a_green =  PI/2;      // bottom
const a_blue  =  7*PI/6;    // top-left

function pt(angle) {
  return { x: cx + R*cos(angle), y: cy + R*sin(angle) };
}

const verts = { red: pt(a_red), green: pt(a_green), blue: pt(a_blue) };

// Trim angle: arc on circumcircle subtended by coloured-circle radius
const trim = asin(r / R);

// Trimmed endpoints for a clockwise arc from angle a to angle b (on circle centred at cx,cy)
function trimmedArc(centre, a_from, a_to) {
  const {x:ox, y:oy} = centre;
  return {
    x1: ox + R*cos(a_from + trim),  y1: oy + R*sin(a_from + trim),
    x2: ox + R*cos(a_to   - trim),  y2: oy + R*sin(a_to   - trim),
  };
}

// Outer clockwise arcs on circumcircle
const origin = {x: cx, y: cy};
const arc_rg = trimmedArc(origin, a_red,          a_green        );
const arc_gb = trimmedArc(origin, a_green,         a_blue         );
const arc_br = trimmedArc(origin, a_blue,          a_red + 2*PI   );

// Inner arc: blue->green on circle whose centre is reflection of origin in chord blue-green
function reflectInLine(p, a, b) {
  const dx = b.x-a.x, dy = b.y-a.y;
  const ex = p.x-a.x, ey = p.y-a.y;
  const t  = (ex*dx + ey*dy) / (dx*dx + dy*dy);
  return { x: 2*(a.x + t*dx) - p.x, y: 2*(a.y + t*dy) - p.y };
}

const rc = reflectInLine(origin, verts.blue, verts.green);

const a_blue_rc  = atan2(verts.blue.y  - rc.y, verts.blue.x  - rc.x);
const a_green_rc = atan2(verts.green.y - rc.y, verts.green.x - rc.x);
const arc_inner  = trimmedArc(rc, a_blue_rc, a_green_rc);

// ── SVG helpers ──────────────────────────────────────────────────────────────

const NS  = "http://www.w3.org/2000/svg";
const svg = document.getElementById("diagram");
svg.setAttribute("width",   size);
svg.setAttribute("height",  size);
svg.setAttribute("viewBox", `0 0 ${size} ${size}`);

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function addArc(a, sweep) {
  const d = `M ${a.x1} ${a.y1} A ${R} ${R} 0 0 ${sweep} ${a.x2} ${a.y2}`;
  svg.appendChild(el("path", {
    d, fill:"none", stroke: color.arrow,
    "stroke-width": stroke_width, "marker-end":"url(#arrow)"
  }));
}

function addCircle(p, fill) {
  svg.appendChild(el("circle", { cx: p.x, cy: p.y, r, fill }));
}

// ── Render ───────────────────────────────────────────────────────────────────

const defs   = el("defs", {});
const marker = el("marker", { id:"arrow", markerWidth:"10", markerHeight:"7",
                               refX:"9", refY:"3.5", orient:"auto" });
marker.appendChild(el("polygon", { points:"0 0, 10 3.5, 0 7", fill: color.arrow }));
defs.appendChild(marker);
svg.appendChild(defs);

addArc(arc_rg, 1);
addArc(arc_gb, 1);
addArc(arc_br, 1);
addArc(arc_inner, 1);

addCircle(verts.red,   color.red);
addCircle(verts.green, color.green);
addCircle(verts.blue,  color.blue);
</script>
</body>
</html>
