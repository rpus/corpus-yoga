<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word clouds — conversation corpus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fff; color: #222; padding: 2rem; }
  header { display: flex; align-items: baseline; gap: 2rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  h1 { font-size: 15px; font-weight: 500; color: #555; }
  .toggle-group { display: flex; gap: 0; border: 0.5px solid #ccc; border-radius: 6px; overflow: hidden; }
  .toggle-btn { background: none; border: none; padding: 5px 14px; font-size: 12px; cursor: pointer; color: #777; border-right: 0.5px solid #ccc; transition: background 0.12s, color 0.12s; }
  .toggle-btn:last-child { border-right: none; }
  .toggle-btn.active { background: #222; color: #fff; }
  .toggle-btn:hover:not(.active) { background: #f5f5f5; }
  #clouds { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
  .cloud-panel { border: 0.5px solid #ddd; border-radius: 8px; padding: 1.25rem; min-height: 320px; }
  .cloud-title { font-size: 12px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
  .cloud-subtitle { font-size: 11px; color: #bbb; margin-bottom: 1rem; font-style: italic; }
  .cloud { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; line-height: 1.6; }
  .word { cursor: default; transition: opacity 0.15s; border-radius: 3px; padding: 1px 3px; }
  .word:hover { opacity: 0.55; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #ddd; }
    .cloud-panel { border-color: #333; }
    .cloud-title { color: #666; }
    .cloud-subtitle { color: #444; }
    .toggle-group { border-color: #444; }
    .toggle-btn { color: #666; border-right-color: #444; }
    .toggle-btn.active { background: #ddd; color: #111; }
    .toggle-btn:hover:not(.active) { background: #252525; }
  }
</style>
</head>
<body>
<header>
  <h1>Word clouds — 35 conversations, March–April 2026</h1>
  <div class="toggle-group">
    <button class="toggle-btn active" data-mode="both">both</button>
    <button class="toggle-btn" data-mode="human">human</button>
    <button class="toggle-btn" data-mode="assistant">assistant</button>
  </div>
</header>
<div id="clouds">
  <div class="cloud-panel">
    <div class="cloud-title">Literal</div>
    <div class="cloud-subtitle" id="literal-sub">Surface word frequency from messages, stop-words removed</div>
    <div class="cloud" id="literal-cloud"></div>
  </div>
  <div class="cloud-panel">
    <div class="cloud-title">Semantic</div>
    <div class="cloud-subtitle">Concepts inferred by Claude from conversation summaries</div>
    <div class="cloud" id="semantic-cloud"></div>
  </div>
</div>

<script>
/*
  literalData: populated from literal_freq.json output of word_freq_literal.py
  Replace the placeholder below with the actual output once the script has been run.
  Format: { human: [{word, count},...], assistant: [...], both: [...] }
*/
const literalData = {
  both: [
    {word:"structure",count:25},{word:"mathematical",count:24},{word:"memory",count:22},
    {word:"intellectual",count:18},{word:"theory",count:18},{word:"structural",count:17},
    {word:"type",count:17},{word:"conjecture",count:17},{word:"framing",count:15},
    {word:"research",count:15},{word:"anthropic",count:15},{word:"ecological",count:13},
    {word:"fellowship",count:13},{word:"framework",count:12},{word:"physics",count:12},
    {word:"paper",count:12},{word:"python",count:12},{word:"distinction",count:11},
    {word:"latex",count:11},{word:"information",count:10},{word:"syntax",count:10},
    {word:"category",count:10},{word:"geometry",count:10},{word:"mathematics",count:10},
    {word:"ideas",count:10},{word:"connection",count:10},{word:"data",count:10},
    {word:"uncertainty",count:9},{word:"philosophical",count:9},{word:"intelligence",count:9},
    {word:"series",count:9},{word:"thinking",count:9},{word:"curvature",count:9},
    {word:"precision",count:8},{word:"primitive",count:8},{word:"logic",count:8},
    {word:"physical",count:8},{word:"compression",count:8},{word:"knowledge",count:8},
    {word:"adjunction",count:8},{word:"html",count:8},{word:"skeleton",count:7},
    {word:"semantics",count:7},{word:"theorem",count:7},{word:"language",count:7},
    {word:"evil",count:7},{word:"chaos",count:7},{word:"terminal",count:7},
    {word:"cayley-dickson",count:7},{word:"register",count:7},{word:"concepts",count:7},
  ],
  human: [],   // populated by word_freq_literal.py
  assistant: []
};

const semanticWords = [
  {word:"adjunction",count:95},{word:"category theory",count:90},
  {word:"skeleton/ecology",count:85},{word:"entropy",count:80},
  {word:"compression",count:78},{word:"information return",count:75},
  {word:"type theory",count:72},{word:"wave mechanics",count:68},
  {word:"Euler identity",count:65},{word:"negation",count:63},
  {word:"Schanuel",count:60},{word:"Cayley–Dickson",count:58},
  {word:"curvature",count:55},{word:"thermodynamics",count:53},
  {word:"epistemology",count:52},{word:"quasiparticle",count:50},
  {word:"Langlands",count:48},{word:"pushout",count:47},
  {word:"topos",count:45},{word:"renormalisation",count:43},
  {word:"Liar paradox",count:42},{word:"Unruh effect",count:40},
  {word:"free energy",count:38},{word:"morphism",count:37},
  {word:"black hole",count:35},{word:"LaTeX",count:34},
  {word:"jq",count:32},{word:"JSON Schema",count:30},
  {word:"film",count:28},{word:"memory architecture",count:27},
  {word:"fellowship",count:25},{word:"inference",count:24},
  {word:"haiku",count:22},{word:"air quality",count:20},
  {word:"SwiftUI",count:18},{word:"workout",count:15},
];

const subtitles = {
  both:      'Surface word frequency from all messages, stop-words removed',
  human:     'Surface word frequency from human messages only',
  assistant: 'Surface word frequency from assistant messages only',
};

function hsvToHex(h, s, v) {
  h = h / 360;
  let r, g, b;
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
  switch(i%6){
    case 0:r=v;g=t;b=p;break; case 1:r=q;g=v;b=p;break;
    case 2:r=p;g=v;b=t;break; case 3:r=p;g=q;b=v;break;
    case 4:r=t;g=p;b=v;break; case 5:r=v;g=p;b=q;break;
  }
  return '#'+[r,g,b].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');
}

function renderCloud(words, containerId, hue) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  if (!words || words.length === 0) {
    el.innerHTML = '<span style="font-size:12px;color:#aaa;font-style:italic;">run word_freq_literal.py to populate this view</span>';
    return;
  }
  const max = Math.max(...words.map(w => w.count));
  const min = Math.min(...words.map(w => w.count));
  const shuffled = [...words].sort(() => Math.random() - 0.5);
  shuffled.forEach(({word, count}) => {
    const t = (count - min) / Math.max(max - min, 1);
    const size = 11 + Math.round(t * 26);
    const lightness = 62 - Math.round(t * 32);
    const sat = 55 + Math.round(t * 25);
    const color = `hsl(${hue}, ${sat}%, ${lightness}%)`;
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = word;
    span.style.fontSize = size + 'px';
    span.style.color = color;
    span.style.fontWeight = t > 0.6 ? '500' : '400';
    span.title = `count: ${count}`;
    el.appendChild(span);
  });
}

let currentMode = 'both';

function update(mode) {
  currentMode = mode;
  document.getElementById('literal-sub').textContent = subtitles[mode];
  const words = literalData[mode];
  renderCloud(words, 'literal-cloud', 210);
}

document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    update(btn.dataset.mode);
  });
});

renderCloud(semanticWords, 'semantic-cloud', 270);
update('both');
</script>
</body>
</html>
