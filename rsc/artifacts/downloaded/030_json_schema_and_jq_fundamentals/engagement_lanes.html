const tNow = Date.now();
const tRange = tNow - tMin;

function fmt(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

  const sp = document.createElement('span');
  sp.textContent = i === 7 ? 'now' : new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  axisEl.appendChild(sp);
}

const tip = document.getElementById('tl-tooltip');

chatIds.forEach(id => {
  const lane = document.createElement('div');
  lane.className = 'tl-lane';

  const label = document.createElement('div');
  label.className = 'tl-label';
  label.textContent = '#' + id + ' ' + nameMap[id];
  label.title = nameMap[id];

  const track = document.createElement('div');
  track.className = 'tl-track';

  const chatSpans = spans.filter(s => s.chat === id);
  const lastTo = Math.max(...chatSpans.map(s => new Date(s.to).getTime()));
  const dormLeft = (lastTo - tMin) / tRange * 100;
  const dormWidth = 100 - dormLeft;
  if (dormWidth > 0) {
    const dorm = document.createElement('div');
    dorm.className = 'tl-dormant';
    dorm.style.left = dormLeft + '%';
    dorm.style.width = dormWidth + '%';
    track.appendChild(dorm);
  }

    const bar = document.createElement('div');
    bar.className = 'tl-bar';
    const left = (new Date(s.from).getTime() - tMin) / tRange * 100;
    const width = Math.max((new Date(s.to).getTime() - new Date(s.from).getTime()) / tRange * 100, 0.25);
    bar.style.left = left + '%';
    bar.style.width = width + '%';
    bar.style.background = colorMap[id];
    bar.style.opacity = '0.85';

    bar.addEventListener('mousemove', e => {
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top = (e.clientY - 10) + 'px';

    bar.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    track.appendChild(bar);

  lane.appendChild(track);
