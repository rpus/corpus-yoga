<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>PM2.5 vs NO&sub2; change 2010&ndash;2024</title>
<style>
  body { font-family: sans-serif; background: #fff; margin: 2rem; color: #333; }
  h2 { font-size: 16px; font-weight: 500; margin-bottom: 0.5rem; }
  .legend { display: flex; gap: 20px; margin-bottom: 1rem; font-size: 13px; color: #666; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
<h2>PM2.5 vs NO&#x2082; change 2010&ndash;2024</h2>
<div class="legend">
  <span><span class="dot" style="background:#D85A30;"></span>Europe</span>
  <span><span class="dot" style="background:#D4537E;"></span>Central East Asia</span>
  <span><span class="dot" style="background:#639922;"></span>North America</span>
</div>
<div style="position:relative;width:100%;max-width:800px;height:560px;">
  <canvas id="scatter"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const cities = [
  { label: 'Beijing',       pm25: -48, no2: -34, region: 'CEA' },
  { label: 'Warsaw',        pm25: -44, no2: -21, region: 'EUR' },
  { label: 'Rotterdam',     pm25: -41, no2: -46, region: 'EUR' },
  { label: 'Berlin',        pm25: -40, no2: -31, region: 'EUR' },
  { label: 'Brussels',      pm25: -39, no2: -30, region: 'EUR' },
  { label: 'Heidelberg',    pm25: -38, no2: -35, region: 'EUR' },
  { label: 'Amsterdam',     pm25: -36, no2: -47, region: 'EUR' },
  { label: 'Chengdu',       pm25: -26, no2: -40, region: 'CEA' },
  { label: 'Paris',         pm25: -35, no2: -34, region: 'EUR' },
  { label: 'Wuhan',         pm25: -33, no2: -37, region: 'CEA' },
  { label: 'Nanjing',       pm25: -32, no2: -39, region: 'CEA' },
  { label: 'Hangzhou',      pm25: -30, no2: -43, region: 'CEA' },
  { label: 'Rome',          pm25: -28, no2: -22, region: 'EUR' },
  { label: 'London',        pm25: -27, no2: -40, region: 'EUR' },
  { label: 'Qingdao',       pm25: -26, no2: -29, region: 'CEA' },
  { label: 'Zhenjiang',     pm25: -25, no2: -37, region: 'CEA' },
  { label: 'Hong Kong',     pm25: -23, no2: -33, region: 'CEA' },
  { label: 'San Francisco', pm25: -22, no2: -23, region: 'NAM' },
  { label: 'Shenzhen',      pm25: -21, no2: -22, region: 'CEA' },
];

const colorMap = { EUR: '#D85A30', CEA: '#D4537E', NAM: '#639922' };
const regionNames = { EUR: 'Europe', CEA: 'Central East Asia', NAM: 'North America' };

const datasets = ['EUR','CEA','NAM'].map(r => ({
  label: regionNames[r],
  data: cities.filter(c => c.region === r).map(c => ({ x: c.pm25, y: c.no2, label: c.label })),
  backgroundColor: colorMap[r] + 'cc',
  borderColor: colorMap[r],
  borderWidth: 1.5,
  pointRadius: 6,
  pointHoverRadius: 8,
}));

new Chart(document.getElementById('scatter'), {
  type: 'scatter',
  data: { datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top: 20, right: 30, bottom: 10, left: 10 } },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: ctx => ctx.raw.label + ': PM2.5 ' + ctx.raw.x + '%, NO\u2082 ' + ctx.raw.y + '%'
        }
      }
    },
    scales: {
      x: {
        title: { display: true, text: 'PM2.5 change 2010\u20132024 (%)', color: '#888', font: { size: 12 } },
        min: -55, max: 5,
        ticks: { color: '#888', callback: v => v + '%' },
        grid: { color: 'rgba(130,130,130,0.15)' }
      },
      y: {
        title: { display: true, text: 'NO\u2082 change 2010\u20132024 (%)', color: '#888', font: { size: 12 } },
        min: -55, max: 5,
        ticks: { color: '#888', callback: v => v + '%' },
        grid: { color: 'rgba(130,130,130,0.15)' }
      }
    }
  },
  plugins: [{
    id: 'cityLabels',
    afterDatasetsDraw(chart) {
      const ctx = chart.ctx;
      ctx.save();
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'left';
      ['EUR','CEA','NAM'].forEach((r, di) => {
        const meta = chart.getDatasetMeta(di);
        datasets[di].data.forEach((pt, i) => {
          const el = meta.data[i];
          if (!el) return;
          const { x, y } = el.getProps(['x','y'], true);
          ctx.fillStyle = colorMap[r];
          const lbl = pt.label;
          const offsetX = lbl === 'San Francisco' ? -70 : lbl === 'Shenzhen' ? -55 : lbl === 'Warsaw' ? -42 : 7;
          const offsetY = lbl === 'Brussels' ? -8 : lbl === 'Heidelberg' ? 12 : lbl === 'Paris' ? 12 : lbl === 'Warsaw' ? -2 : -3;
          ctx.fillText(lbl, x + offsetX, y + offsetY);
        });
      });
      ctx.restore();
    }
  }]
});
</script>
